[package]
name = "umbra-tor"
version = "0.1.0"
edition = "2021"
# Aligned with Elite's core workspace (vodozemac 0.11 requires >= 1.89).
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Optional Tor (arti) transport spike for Umbra's libp2p stack"
publish = false
readme = "README.md"

[features]
default = []
# Embed arti-client. Without this feature the crate is a cheap stub (multiaddr
# helpers + SOCKS design) so the workspace stays lean on mobile / CI without Tor.
tor = ["dep:arti-client", "dep:tor-rtcompat", "dep:tokio-util"]
# EXPERIMENTAL: host an inbound v3 onion service (arti `onion-service-service`).
# Off by default; implies `tor`.
tor-listen = [
    "tor",
    "arti-client/onion-service-service",
    "dep:tor-hsservice",
    "dep:tor-cell",
    "dep:tor-proto",
    "dep:safelog",
]

[dependencies]
futures = "0.3"
# Pinned to 0.55 to match Elite's workspace.dependencies / arti 0.35 line.
libp2p = { version = "0.55", default-features = false, features = ["tokio"] }
thiserror = "2"
tracing = "0.1"

# arti 0.35 uses rusqlite 0.37 (same as umbra_core). Bump together.
arti-client = { version = "0.35", optional = true, default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "static-sqlite"] }
tor-rtcompat = { version = "0.35", optional = true, default-features = false, features = ["tokio", "rustls"] }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }
# Only for `tor-listen` (EXPERIMENTAL): rend/stream request handling, BEGIN/
# CONNECTED/END cells, and redaction-aware HsId formatting. Same 0.35 line as arti.
tor-hsservice = { version = "0.35", optional = true, default-features = false }
tor-cell = { version = "0.35", optional = true, default-features = false }
tor-proto = { version = "0.35", optional = true, default-features = false, features = ["hs-service"] }
safelog = { version = "0.6", optional = true, default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[[example]]
name = "dial_info"
required-features = []
