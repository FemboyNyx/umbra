# Add under app/pubspec.yaml (dev_dependency + msix_config). Copilot owns app/.
#
# dev_dependencies:
#   msix: ^3.16.0
#
# Then at the bottom of pubspec.yaml:

msix_config:
  display_name: Umbra
  publisher_display_name: FemboyNyx
  identity_name: io.github.femboynyx.umbra
  msix_version: 0.1.0.0
  logo_path: ../packaging/icons/umbra-256.png   # relative to app/
  capabilities: internetClient, microphone, webcam
  # Do NOT set certificate_path / certificate_password here; ci.yml/release.yml pass them
  # as --certificate-path / --certificate-password flags from the WINDOWS_CERT_* secrets
