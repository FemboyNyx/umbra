name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    name: Detect packages
    runs-on: ubuntu-latest
    outputs:
      has_core: ${{ steps.check.outputs.has_core }}
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f core/Cargo.toml ]; then
            echo "has_core=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_core=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f app/pubspec.yaml ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

  rust-core:
    name: Rust core tests
    needs: detect
    if: needs.detect.outputs.has_core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo test --all-features

  build-android:
    name: Android APK
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: Configure Android signing
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            {
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS}"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Using release keystore from secrets."
          else
            echo "ANDROID_KEYSTORE_* secrets missing; building unsigned/debug APK."
          fi
      - name: Build APK
        working-directory: app
        run: |
          if [ -f android/key.properties ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-android-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build-windows:
    name: Windows zip
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: Build Windows
        working-directory: app
        run: flutter build windows --release
      - name: Zip release
        working-directory: app
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath umbra-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-windows-zip
          path: app/umbra-windows.zip
          if-no-files-found: error

  build-linux:
    name: Linux tar.gz
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: Build Linux
        working-directory: app
        run: flutter build linux --release
      - name: Package tar.gz
        working-directory: app
        run: |
          tar -C build/linux/x64/release/bundle -czf umbra-linux.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-linux-targz
          path: app/umbra-linux.tar.gz
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [detect, rust-core, build-android, build-windows, build-linux]
    if: always() && needs.detect.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure at least one package job succeeded or was skipped cleanly
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.rust-core.result }}" \
            "${{ needs.build-android.result }}" \
            "${{ needs.build-windows.result }}" \
            "${{ needs.build-linux.result }}"
          do
            case "$result" in
              success|skipped) ;;
              *)
                echo "Build job failed with result=$result"
                exit 1
                ;;
            esac
          done
      - name: Download artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Flatten downloaded artifacts into release-assets/
          if [ -d dist ]; then
            find dist -type f \( -name '*.apk' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.AppImage' -o -name '*.msix' \) \
              -exec cp -v {} release-assets/ \;
          fi
          if [ -z "$(ls -A release-assets 2>/dev/null || true)" ]; then
            echo "No binary artifacts yet (core/app still landing). Publishing notes-only release."
            echo "Umbra ${GITHUB_REF_NAME}: no platform binaries attached (app/ not present)." > release-assets/README-release.txt
          fi
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Umbra ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
