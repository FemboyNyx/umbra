name: CI

on:
  push:
    branches: [main, backup]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  detect:
    name: Detect packages
    runs-on: ubuntu-latest
    outputs:
      has_core: ${{ steps.check.outputs.has_core }}
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f core/Cargo.toml ]; then
            echo "has_core=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_core=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f app/pubspec.yaml ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

  rust-core:
    name: Rust core (fmt / clippy / test)
    needs: detect
    if: needs.detect.outputs.has_core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all-features

  flutter-analyze:
    name: Flutter analyze / test
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: analyze
        working-directory: app
        run: flutter analyze
      - name: test
        working-directory: app
        run: flutter test

  build-android:
    name: Build Android APK
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: Configure Android signing
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            {
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS}"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Using release keystore from secrets."
          else
            echo "ANDROID_KEYSTORE_* secrets missing; Flutter will use debug signing."
          fi
      - name: Build APK
        working-directory: app
        run: |
          if [ -f android/key.properties ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-android-apk
          path: |
            app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows zip
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: Build Windows
        working-directory: app
        run: flutter build windows --release
      - name: Zip release
        working-directory: app
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath umbra-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-windows-zip
          path: app/umbra-windows.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux tar.gz
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: Build Linux
        working-directory: app
        run: flutter build linux --release
      - name: Package tar.gz
        working-directory: app
        run: |
          tar -C build/linux/x64/release/bundle -czf umbra-linux.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-linux-targz
          path: app/umbra-linux.tar.gz
          if-no-files-found: error

  ci-gate:
    name: CI gate
    needs: [detect, rust-core, flutter-analyze, build-android, build-windows, build-linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        run: |
          set -euo pipefail
          echo "has_core=${{ needs.detect.outputs.has_core }}"
          echo "has_app=${{ needs.detect.outputs.has_app }}"
          # Skipped jobs (missing folders) are fine; failed required jobs are not.
          for result in \
            "${{ needs.rust-core.result }}" \
            "${{ needs.flutter-analyze.result }}" \
            "${{ needs.build-android.result }}" \
            "${{ needs.build-windows.result }}" \
            "${{ needs.build-linux.result }}"
          do
            case "$result" in
              success|skipped) ;;
              *)
                echo "Job failed with result=$result"
                exit 1
                ;;
            esac
          done
          echo "CI gate passed."
